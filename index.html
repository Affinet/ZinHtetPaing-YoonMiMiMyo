<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation - Zin Htet Paing & Yoon Mi Mi Myo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Padauk', sans-serif;
            background-color: #1a0507;
            color: #fff5f8;
            text-align: center;
            overflow-x: hidden;
            padding: 15px 10px 80px 10px;
        }

        /* အသဲပုံလေးများ စီးကျသည့် Animation */
        .heart {
            position: fixed;
            color: #ff4081;
            font-size: 18px;
            top: -10px;
            z-index: 999;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* ပုံတစ်ခုချင်းစီ အပေါ်မှအောက်သို့ ညင်သာစွာ ပေါ်လာစေရန် */
        .photo-wrapper {
            max-width: 600px;
            margin: 12px auto; /* ပုံတစ်ပုံနှင့်တစ်ပုံကြား အကွာအဝေး အလွန်မကွာစေရန် */
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.9s ease-out, transform 0.9s ease-out;
        }

        .photo-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* မင်္ဂလာဓာတ်ပုံများ Styling */
        .wedding-photo {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            display: block;
        }

        /* အချက်အလက်နှင့် QR Code များ ထည့်သွင်းမည့် ဘောက်စ် */
        .card {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 25px 15px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
        }

        .sub-title {
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .info-box {
            background-color: rgba(136, 14, 79, 0.45);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            color: #ffffff;
            text-align: left;
            line-height: 2.1;
            border: 1px solid #d4af37;
        }

        /* QR Code များ စီစဉ်မှု */
        .qr-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-top: 15px;
        }

        .qr-item {
            background: rgba(255, 255, 255, 0.95);
            color: #1a0507;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .qr-item img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        .qr-label {
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            color: #880e4f;
        }

        /* သီချင်းဖွင့်/ပိတ် ခလုတ် */
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #d4af37;
            color: #1a0507;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 1000;
        }
    </style>
</head>
<body>

<!-- သီချင်းလင့်ခ်အမှန် -->
<audio id="weddingMusic" loop>
    <source src="https://github.com/Affinet/ZinHtetPaing-YoonMiMiMyo/raw/refs/heads/main/videoplayback.m4a" type="audio/mp4">
</audio>
<button class="music-btn" onclick="toggleMusic()">🎵</button>

<!-- မင်္ဂလာဓာတ်ပုံ (၈) ပုံ (သင်ပေးထားသော နာမည်အသစ်များဖြင့် ချိတ်ဆက်ထားသည်) -->
